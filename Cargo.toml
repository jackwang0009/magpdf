[workspace]
resolver = "3"
members = [
  "engine/pdfium-sys",
  "engine/magpdf-engine",
  "engine/magpdf-text",
  "engine/magpdf-components",
  "engine/magpdf-scan",
  "engine/magpdf-cli",
  "engine/magpdf-ipc",
  "engine/magpdf-engine-proc",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/jackwang0009/mgpdf"

[workspace.dependencies]
# 工作区内部
pdfium-sys = { path = "engine/pdfium-sys" }
magpdf-engine = { path = "engine/magpdf-engine" }
magpdf-text = { path = "engine/magpdf-text" }
magpdf-components = { path = "engine/magpdf-components" }
magpdf-scan = { path = "engine/magpdf-scan" }
magpdf-ipc = { path = "engine/magpdf-ipc" }

# 通用（《工程规范》4：库用 thiserror，应用层用 anyhow，日志用 tracing）
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
png = "0.17"
# 仅测试用：解压 PDF 的 FlateDecode 流（png 已依赖它，不引入新的第三方代码）
flate2 = "1"
# OCR（方案 6.5、V09）：ONNX Runtime 绑定以 load-dynamic 方式在运行时加载 models/onnxruntime/onnxruntime.dll，
# 构建时不下载任何二进制；api-31 对应清单里固定的 ONNX Runtime 1.31.x。
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "tracing", "api-31"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
# V06 进程架构：命名管道（tokio）、共享内存（windows crate）、协议类型生成（ts-rs）、I1 对照（rmp-serde）
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
ts-rs = "12"
rmp-serde = "1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_System_SystemInformation",
] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# unsafe 块必须带 // SAFETY: 说明（《工程规范》4）
undocumented_unsafe_blocks = "deny"
# 库代码不用 unwrap/expect；测试例外见 clippy.toml
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"
