# PR 流水线（《工程规范》第 7 节）：构建（用 PDFium 预编译库）、代码检查、单元测试、许可证检查。
# 往返/编辑测试子集、契约测试在 V02、V06、V14 落地后加入；PDFium 分支自己的流水线在 magpdf-pdfium 仓库。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 界面与协议（lint、typecheck、test、build）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    name: 引擎（fmt、clippy、test）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 拉取 PDFium 预编译库
        run: pwsh scripts/fetch-pdfium-prebuilt.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: magpdf-cli 烟雾测试
        run: cargo run --locked -p magpdf-cli -- --help

  licenses:
    name: 依赖许可证与安全公告
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
