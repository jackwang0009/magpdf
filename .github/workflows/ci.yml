# PR 流水线（《工程规范》第 7 节）：构建（用 PDFium 预编译库）、代码检查、单元测试、许可证检查。
# 往返/编辑测试子集、契约测试在 V02、V06、V14 落地后加入；PDFium 分支自己的流水线在 magpdf-pdfium 仓库。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 界面与协议（lint、typecheck、test、build）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    name: 引擎与主进程（fmt、clippy、test）
    runs-on: windows-latest
    # 主进程带着 Tauri（两百多个 crate），没有缓存的那一次编译要多留些时间。
    # 调试构建从开发服务器加载界面，不需要先构建前端；界面端到端测试不在这里跑（《测试计划》：每晚）。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 拉取 PDFium 预编译库
        run: pwsh scripts/fetch-pdfium-prebuilt.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 失败时把真正的 FAILED / panicked 和日志末尾打成 annotation（公开 API 能读到；不要匹配「0 failed」）。
      # 用 cmd 跑 cargo，避免 PowerShell 管道改写原生退出码。
      - name: cargo test --workspace --locked
        env:
          RUST_BACKTRACE: '1'
          CARGO_TERM_COLOR: always
        run: |
          cmd /c "cargo test --workspace --locked --no-fail-fast > cargo-test.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content cargo-test.log -Encoding utf8
          if ($code -ne 0) {
            Select-String -Path cargo-test.log -Encoding utf8 -Pattern ' \.\.\. FAILED$|^failures:$|panicked at|test result: FAILED' |
              Select-Object -First 8 |
              ForEach-Object { "::error::$($_.Line.Trim())" }
            Get-Content cargo-test.log -Encoding utf8 -Tail 30 |
              ForEach-Object { "::error::tail: $($_.TrimEnd())" }
          }
          exit $code
      - name: 上传 cargo test 日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-log
          path: cargo-test.log
          retention-days: 14
      - name: 协议类型与入库的一致（cargo test 会重新生成 packages/protocol/src/generated）
        run: |
          git add --intent-to-add packages/protocol/src/generated
          git diff --exit-code -- packages/protocol/src/generated
      - name: magpdf-cli 烟雾测试
        run: cargo run --locked -p magpdf-cli -- --help
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 自制样本校验（往返测试的烟雾子集）
        run: |
          python -m pip install -r tests/requirements-test.txt
          python tests/corpus/synthetic/check.py --cli target/debug/magpdf-cli.exe
      # 自制样本和基线的比较（scripts/nightly-roundtrip.ps1 -SkipCalibrate -RequireBaseline）先不放在这里：
      # 基线是在开发机上生成的，要等每晚的流水线在 GitHub 的机器上跑过一次、确认结果一样之后再加（V14 报告第 9 节）。
      - name: 往返测试报告工具的单元测试
        run: python -X dev -m unittest discover -s tests/corpus/tools -p "test_*.py"

  licenses:
    name: 依赖许可证与安全公告
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
